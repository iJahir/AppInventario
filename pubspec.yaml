name: inventario_app
description: "Aplicacion movil de gestion de inventario"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  shared_preferences: ^2.5.2
  http: ^1.2.1
  fl_chart: ^0.70.0
  image_picker: ^1.0.7
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^17.1.2
  connectivity_plus: ^6.0.3
  pdf: ^3.10.8
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo/logo.png"
  adaptive_icon_background: "#1a1a3e"
  adaptive_icon_foreground: "logo/logo.png"

flutter:
  uses-material-design: true
